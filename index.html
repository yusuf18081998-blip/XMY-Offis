<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XMY Yozuv</title>
<link rel="icon" type="image/png" href="../assets/Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="docs.css">
</head>
<body>

<div class="appbar">
  <a class="appbar-brand" href="../index.html" title="XMY Ofisga qaytish">
    <img src="../assets/Logo.png" alt="XMY">
  </a>
  <input class="appbar-title" id="docTitle" value="Nomsiz hujjat" spellcheck="false">
  <div class="appbar-menu">
    <button id="menuFile">Fayl</button>
    <button id="btnUndo" title="Bekor qilish (Ctrl+Z)">Bekor qilish</button>
    <button id="btnRedo" title="Qaytarish (Ctrl+Y)">Qaytarish</button>
  </div>
  <div class="appbar-spacer"></div>
  <span class="appbar-status" id="saveStatus">Saqlandi</span>
  <div class="appbar-actions">
    <button class="btn btn-outline" id="btnPrint">Chop etish</button>
    <button class="btn btn-solid" id="btnExport">Yuklab olish</button>
  </div>
</div>

<div class="toolbar" id="toolbar">
  <select class="select-box" id="fmtBlock" title="Uslub">
    <option value="p">Oddiy matn</option>
    <option value="h1">Sarlavha 1</option>
    <option value="h2">Sarlavha 2</option>
    <option value="h3">Sarlavha 3</option>
    <option value="blockquote">Iqtibos</option>
  </select>
  <select class="select-box" id="fmtFont" title="Shrift">
    <option value="Inter">Inter</option>
    <option value="'Space Grotesk'">Space Grotesk</option>
    <option value="Georgia">Georgia</option>
    <option value="'Times New Roman'">Times New Roman</option>
    <option value="Arial">Arial</option>
    <option value="'Courier New'">Courier New</option>
  </select>
  <select class="select-box" id="fmtSize" title="O'lcham">
    <option value="1">10</option><option value="2">13</option>
    <option value="3" selected>16</option><option value="4">18</option>
    <option value="5">24</option><option value="6">32</option><option value="7">48</option>
  </select>

  <div class="divider-v"></div>
  <button class="icon-btn" data-cmd="bold" title="Qalin (Ctrl+B)"><svg viewBox="0 0 24 24"><path d="M6 4h7a4 4 0 010 8H6zM6 12h8a4 4 0 010 8H6z"/></svg></button>
  <button class="icon-btn" data-cmd="italic" title="Qiya (Ctrl+I)"><svg viewBox="0 0 24 24"><path d="M10 4h8M6 20h8M13 4L11 20"/></svg></button>
  <button class="icon-btn" data-cmd="underline" title="Tagiga chizish (Ctrl+U)"><svg viewBox="0 0 24 24"><path d="M6 4v7a6 6 0 0012 0V4M4 20h16"/></svg></button>
  <button class="icon-btn" data-cmd="strikeThrough" title="Ustidan chizish"><svg viewBox="0 0 24 24"><path d="M4 12h16M8 6c0-2 2-2 4-2s4 1 4 3M8 18c0 2 2 2 4 2s4-1 4-3"/></svg></button>

  <div class="divider-v"></div>
  <label class="icon-btn" title="Matn rangi" style="position:relative">
    <svg viewBox="0 0 24 24"><path d="M4 20h16M8 16l4-12 4 12M6.5 12h7"/></svg>
    <input type="color" id="txtColor" value="#f2f4f2" style="position:absolute;inset:0;opacity:0;cursor:pointer">
  </label>
  <label class="icon-btn" title="Ajratib ko'rsatish" style="position:relative">
    <svg viewBox="0 0 24 24"><path d="M4 20h16M6 14l6-8 6 8-6 4z"/></svg>
    <input type="color" id="hlColor" value="#39ff6a" style="position:absolute;inset:0;opacity:0;cursor:pointer">
  </label>

  <div class="divider-v"></div>
  <button class="icon-btn" data-cmd="justifyLeft" title="Chapga"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h12M3 18h16"/></svg></button>
  <button class="icon-btn" data-cmd="justifyCenter" title="Markazga"><svg viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M4 18h16"/></svg></button>
  <button class="icon-btn" data-cmd="justifyRight" title="O'ngga"><svg viewBox="0 0 24 24"><path d="M3 6h18M9 12h12M5 18h16"/></svg></button>
  <button class="icon-btn" data-cmd="justifyFull" title="Kenglik bo'yicha"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>

  <div class="divider-v"></div>
  <button class="icon-btn" data-cmd="insertUnorderedList" title="Ro'yxat"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
  <button class="icon-btn" data-cmd="insertOrderedList" title="Raqamli ro'yxat"><svg viewBox="0 0 24 24"><path d="M10 6h11M10 12h11M10 18h11M4 6h1v3M4 13h2l-2 2h2M4 17.5h2M4 20.5h2"/></svg></button>
  <button class="icon-btn" data-cmd="outdent" title="Chekinishni kamaytirish"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h10M3 18h18M10 9l-3 3 3 3"/></svg></button>
  <button class="icon-btn" data-cmd="indent" title="Chekinishni oshirish"><svg viewBox="0 0 24 24"><path d="M3 6h18M11 12h10M3 18h18M7 9l3 3-3 3"/></svg></button>

  <div class="divider-v"></div>
  <button class="icon-btn" id="btnLink" title="Havola qo'shish"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.66 0l2.83-2.83a4 4 0 10-5.66-5.66l-1 1M14 10a4 4 0 00-5.66 0L5.5 12.83a4 4 0 105.66 5.66l1-1"/></svg></button>
  <button class="icon-btn" id="btnImage" title="Rasm qo'shish (kompyuteringizdan)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg></button>
  <button class="icon-btn" id="btnClearFmt" title="Formatni tozalash"><svg viewBox="0 0 24 24"><path d="M4 4l16 16M13 4H7L4 8l6 6M9.5 20l4-8"/></svg></button>
</div>

<div class="doc-scroll">
  <div class="page" id="page">
    <div class="editor" id="editor" contenteditable="true" spellcheck="true" aria-label="Hujjat matni"></div>
  </div>
</div>

<div class="statusbar">
  <span id="wordCount">0 ta so'z</span>
  <span id="charCount">0 ta belgi</span>
</div>

<!-- Fayl menyusi -->
<div class="dropdown" id="fileDropdown">
  <button data-action="new">Yangi hujjat</button>
  <button data-action="open">Ochish (.txt / .html)</button>
  <input type="file" id="fileInput" accept=".txt,.html" hidden>
  <div class="dropdown-sep"></div>
  <button data-action="export-html">Yuklab olish — .html</button>
  <button data-action="export-txt">Yuklab olish — .txt</button>
  <div class="dropdown-sep"></div>
  <button data-action="print">Chop etish</button>
</div>

<div class="modal-overlay" id="linkModal">
  <div class="modal">
    <h3>Havola qo'shish</h3>
    <input type="url" id="linkUrl" placeholder="https://" class="select-box" style="width:280px;padding:.6rem">
    <div class="modal-actions">
      <button class="btn btn-outline" id="linkCancel">Bekor qilish</button>
      <button class="btn btn-solid" id="linkOk">Qo'shish</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastText"></span></div>

<script src="docs.js"></script>
</body>
</html>
