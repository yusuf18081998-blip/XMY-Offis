<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XMY Taqdimot</title>
<link rel="icon" type="image/png" href="../assets/Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="slides.css">
</head>
<body>

<div class="appbar">
  <a class="appbar-brand" href="../index.html" title="XMY Ofisga qaytish">
    <img src="../assets/Logo.png" alt="XMY">
  </a>
  <input class="appbar-title" id="docTitle" value="Nomsiz taqdimot" spellcheck="false">
  <div class="appbar-menu">
    <button id="btnNewSlide">+ Slayd</button>
    <button id="btnDupSlide">Nusxalash</button>
    <button id="btnDelSlide">O'chirish</button>
  </div>
  <div class="appbar-spacer"></div>
  <span class="appbar-status" id="saveStatus">Saqlandi</span>
  <div class="appbar-actions">
    <button class="btn btn-outline" id="btnExport">Yuklab olish</button>
    <button class="btn btn-solid" id="btnPresent">Taqdimotni boshlash</button>
  </div>
</div>

<div class="toolbar">
  <button class="btn btn-outline" id="addText"><svg viewBox="0 0 24 24"><path d="M4 6h16M12 6v14"/></svg> Matn</button>
  <button class="btn btn-outline" id="addRect"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg> To'rtburchak</button>
  <button class="btn btn-outline" id="addEllipse"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg> Doira</button>
  <button class="btn btn-outline" id="addImage"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg> Rasm</button>
  <div class="divider-v"></div>
  <label class="icon-btn" title="Slayd foni" style="position:relative">
    <svg viewBox="0 0 24 24"><path d="M4 20h16M6 14l6-8 6 8-6 4z"/></svg>
    <input type="color" id="slideBg" value="#111111" style="position:absolute;inset:0;opacity:0;cursor:pointer">
  </label>
  <label class="icon-btn" title="Element rangi" style="position:relative" id="fillWrap">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
    <input type="color" id="fillColor" value="#39ff6a" style="position:absolute;inset:0;opacity:0;cursor:pointer">
  </label>
  <button class="icon-btn" id="btnDeleteEl" title="Elementni o'chirish"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg></button>
</div>

<div class="editor-body">
  <aside class="slide-panel" id="slidePanel"></aside>
  <div class="canvas-wrap">
    <div class="slide-canvas" id="slideCanvas"></div>
  </div>
</div>

<input type="file" id="imageInput" accept="image/*" hidden>

<div class="present-overlay" id="presentOverlay">
  <div class="present-stage" id="presentStage"></div>
  <button class="present-close" id="presentClose" title="Chiqish (Esc)">&times;</button>
  <div class="present-nav">
    <button id="presentPrev">&larr;</button>
    <span id="presentCount">1 / 1</span>
    <button id="presentNext">&rarr;</button>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastText"></span></div>

<script src="slides.js"></script>
</body>
</html>
